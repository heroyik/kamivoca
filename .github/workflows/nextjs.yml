# Dual-version deployment: main (root) and v2.x (/v2)
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main", "v1.3-maintenance", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Export
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAdXlAJZ24Y1o9d1wp6__ZZrtko2mjrD1g"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "vocajapones-app-77777.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "vocajapones-app-77777"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "vocajapones-app-77777.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "588675203123"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:588675203123:web:54a1996267a2d42acee346"
          NEXT_PUBLIC_BASE_PATH: "/kamivoca"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
